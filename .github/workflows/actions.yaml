name: 'Actions CI'

# lints the workflows on its own, so a broken workflow file in another workflow still gets reported; "Workflow Lint"
# is a required check, so a change that breaks this workflow itself blocks the merge as well

on:
  # run on pushes to main
  push:
    branches:
      - main
      - gh-readonly-queue/main/**
  # run on pull requests that target the main branch
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  # on main, we want all builds to complete even if commits/merging happens faster to make it easier to discover at which point
  # something broke; else, we cancel "old" builds and run/(re)start the build with the latest changes
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}-{1}', github.workflow, github.sha) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow_lint:
    name: 'Workflow Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: v2026.11.6
      # `mise run` would otherwise also install the local development tools of mise.toml
      MISE_TASK_RUN_AUTO_INSTALL: false

    steps:
      - name: StepSecurity - Harden Github-hosted Runners
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit # mise downloads the pinned tools
          disable-telemetry: true
          disable-sudo: true

      - name: Git - Checkout
        id: git_checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mise - Install Tools
        id: mise_install
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:koalaman/shellcheck aqua:mvdan/sh aqua:jqlang/jq
        env:
          # install exactly the versions and checksums of mise.lock
          MISE_LOCKED: 1

      - name: Actionlint - Lint Workflows and Test CI Scripts
        id: actionlint
        run: mise run check:actions
