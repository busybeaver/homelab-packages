name: 'Scripts Test CI'

on:
  # run on pushes to main
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/scripts_test.yaml'
  # run on pull requests that target the main branch
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/scripts_test.yaml'

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}-{1}', github.workflow, github.sha) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scripts_test:
    name: 'Test Scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: StepSecurity - Harden Github-hosted Runners
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >
            github.com:443

      - name: Git - Checkout
        id: git_checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test - download_docker_compose.sh
        id: test_download_docker_compose
        run: bash tests/download_docker_compose_test.sh
