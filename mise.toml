# Tooling and tasks of this repository. The tools are pinned so that the CI and local runs use the same versions; Renovate
# updates the pins and mise.lock records their checksums. Run `mise run init` once, then `mise tasks` to list all tasks.

[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0" # also used by actionlint for `run:` scripts
"aqua:mvdan/sh" = "3.14.1" # shfmt
"aqua:jqlang/jq" = "1.8.2" # used by the CI Gate (.github/scripts/ci-gate.sh)
"aqua:zizmorcore/zizmor" = "1.31.1" # security audit of the GitHub Actions workflows
# goss tests the Docker images; dcgoss is a script in the same release, so both pins must stay on the same version
"aqua:goss-org/goss" = "0.4.10"
"github:goss-org/goss" = { version = "0.4.10", asset_pattern = "dcgoss", bin = "dcgoss" }
# local development only, the CI does not install them
"aqua:evilmartians/lefthook" = "2.2.2" # git hooks (lefthook.yml)
"aqua:oxc-project/oxc/oxfmt" = "0.75.0" # formatter (.oxfmtrc.json)
"aqua:cli/cli" = "2.103.3" # gh
"aqua:nektos/act" = "0.2.95" # runs the GitHub Actions workflows locally (.actrc)
"aqua:cocogitto/cocogitto" = "7.0.0" # conventional commits (cog.toml)
# the linters of the super-linter CI checks, so they run locally as well (configs in .github/linters)
"aqua:hadolint/hadolint" = "2.15.1"
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rvben/rumdl" = "0.3.2" # Markdown, reads the markdownlint config

[settings]
lockfile = true

[tasks.init]
description = "Install the tools and the git hooks"
alias = "initialize"
run = ["mise install", "lefthook install"]

# snapcraft and multipass are no mise tools, so brew installs them
[tasks."install:snap"]
description = "Install snapcraft and multipass to build the snaps (macOS only)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "$(uname -s)" != "Darwin" ]]; then
  echo "This task works only on macOS; on other systems install snapcraft and multipass manually" >&2
  exit 1
fi
export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_INSECURE_REDIRECT=1 HOMEBREW_CASK_OPTS=--require-sha
brew install snapcraft
brew install --cask multipass
'''

[tasks."uninstall:snap"]
description = "Uninstall snapcraft and multipass (macOS only)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "$(uname -s)" != "Darwin" ]]; then
  echo "This task works only on macOS; on other systems uninstall snapcraft and multipass manually" >&2
  exit 1
fi
brew uninstall snapcraft
brew uninstall --cask multipass
'''

[tasks.format]
description = "Format the given files, or all files without arguments"
alias = "fmt"
run = "oxfmt"

[tasks.check]
description = "Run all checks"
depends = ["check:*"]

[tasks."check:format"]
description = "Check the formatting of the given files, or all files without arguments"
run = "oxfmt --check"

[tasks."check:actions"]
description = "Lint and audit the GitHub Actions workflows, lint and test the CI scripts"
run = [
  "actionlint",
  "zizmor --offline .",
  "shellcheck .github/scripts/*.sh",
  "shfmt --diff .github/scripts/*.sh",
  "bash .github/scripts/test-ci-gate.sh",
]

# the Docker CI lints only the images in docker/; info findings are shown but do not fail, as rules newer than the
# hadolint of the super-linter CI check (e.g. DL3066) report on the info level
[tasks."check:dockerfiles"]
description = "Lint the Dockerfiles with hadolint"
run = "git ls-files -z -- ':(glob)docker/**/Dockerfile*' | xargs -0 hadolint --config .github/linters/.hadolint.yaml --failure-threshold warning"

[tasks."check:editorconfig"]
description = "Check the tracked files against the .editorconfig"
run = "git ls-files -z | xargs -0 editorconfig-checker -config .github/linters/.ecrc"

[tasks."check:secrets"]
description = "Scan the files for secrets with gitleaks"
run = "gitleaks dir --config .github/linters/.gitleaks.toml --redact --no-banner ."

[tasks."check:markdown"]
description = "Lint the Markdown files"
run = "rumdl check --config .github/linters/.markdown-lint.yml ."

[tasks.commit]
description = "Create a conventional commit: mise run commit <type> <message> [scope]; see `cog commit --help`"
alias = "cm"
run = "cog commit"

[tasks.ci]
description = "Run the GitHub Actions workflows locally; the arguments go to act (default event: push)"
run = "act"

[tasks."snap:build"]
description = "Build the snap of the given package"
alias = "snap"
usage = 'arg "<package>" help="directory in snaps/"'
# with --debug, snapcraft opens a shell in the build environment on errors
run = 'cd "snaps/${usage_package:?}" && snapcraft --debug'

[tasks."snap:login-token"]
description = "Create the login token to push releases of all snaps to the snapcraft store"
run = '''
#!/usr/bin/env bash
set -euo pipefail
SNAPS=$(ls -m snaps | tr -d ' ')
snapcraft export-login --snaps="$SNAPS" --acls="package_access,package_push,package_update,package_release" .login_token.txt
'''

[tasks."docker:build"]
description = "Build the Docker image of the given package as local-build_<package>"
alias = "docker"
usage = '''
arg "<package>" help="directory in docker/"
arg "[args]..." var=#true help="additional arguments for docker build"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- ${usage_args-}"
cd "docker/${usage_package:?}"
docker build "$@" -t "local-build_${usage_package}" .
'''
